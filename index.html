<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <link rel="stylesheet" href="/day1/style.css">
</head>
<body>
    <div class="full_body">
        <div class="form">
            <div class="Sign_up hidden">
                <h4>Create Account</h4>
                <p>Get started with your new account today.</p>
            </div>
            <div class="Login">
                <h4>Welcome back</h4>
                <p>Please enter you details to login</p>
            </div>
            <form>
                <label for="email">Email Address</label>
                <input type="text" id="email" name="email" placeholder="you@example.com">
                <label for="password">Password</label>
                <input type="password" id="password" name="password">
                <button>Login</button>
            </form>
        </div>
        <p class="existing_acc hidden">Already have an account? <a href="#" id="login_button">Login</a></p>
        <p class="new_acc">Don't have an account? <a href="#" id="sign_up_button">Sign up</a></p>
    </div>
    
</body>
<script src="/day1/script.js"></script>
</html>
