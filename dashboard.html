     <!-- DASHBOARD JAVASCRIPT CONNECTION -->
    <script>
        const API_URL = 'http://localhost:3000';

        // 1. Immediately check if the user has a saved access token
        const token = localStorage.getItem('access_token');

        // If no token exists, kick the user back to the login page immediately
        if (!token) {
            window.location.href = 'index.html';
        }

        // 2. Fetch the logged-in user's profile data from the backend
        async function fetchDashboardData() {
            try {
                const response = await fetch(`${API_URL}/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    // Update the HTML text with user details from the backend
                    document.getElementById('userEmail').textContent = data.user.email;
                    document.getElementById('userId').textContent = data.user.id;
                } else {
                    // Token expired or invalid — clear it and force re-login
                    alert('Session expired. Please log in again.');
                    localStorage.removeItem('access_token');
                    window.location.href = 'index.html';
                }
            } catch (error) {
                console.error('Error fetching dashboard data:', error);
            }
        }

        // 3. Logout function
        function handleLogout() {
            localStorage.removeItem('access_token');
            window.location.href = 'index.html';
        }

        // Run the fetch function when the page loads
        fetchDashboardData();
    </script>
</body>
</html>
